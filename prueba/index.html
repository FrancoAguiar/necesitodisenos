<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propose | Generador de Presupuestos Premium</title>
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Manrope:wght@400;600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb', // Primary Blue
                            700: '#1d4ed8', // Deep Blue
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        surface: {
                            900: '#0b1220', // Navbar
                            800: '#0f172a', // App bg
                            700: '#1e293b', // Panels
                            600: '#334155', // Borders/Hover
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'], // UI Font
                        serif: ['"Playfair Display"', 'serif'], // Document Titles
                        manrope: ['Manrope', 'sans-serif'],
                        source: ['"Source Sans 3"', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow': '0 0 20px -5px rgba(37, 99, 235, 0.4)',
                        'doc': '0 25px 50px -12px rgba(0, 0, 0, 0.5)',
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Estilos personalizados y Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e5e7eb; }
        
        /* Utilidades para campos editables que parecen texto estático */
        .editable-field {
            background: transparent;
            border: 1px dashed transparent;
            transition: all 0.2s ease;
            width: 100%;
            resize: none;
            overflow: hidden;
        }
        .editable-field:hover, .editable-field:focus {
            border-color: #cbd5e1;
            background: rgba(255,255,255,0.5);
            outline: none;
        }
        .dark .editable-field:hover, .dark .editable-field:focus {
            border-color: #475569;
            background: rgba(30,41,59,0.5);
        }

        /* Utilidad para auto-expandir textareas */
        .auto-expand {
            field-sizing: content; /* CSS moderno, fallback en JS si es necesario, pero funciona en Chromium reciente */
            min-height: 1lh;
        }

        /* CSS ESPECÍFICO PARA IMPRESIÓN Y GENERACIÓN DE PDF */
        @media print {
            body { background: white !important; color: black !important; }
            .no-print, nav, aside, .ui-panel, .ui-controls { display: none !important; }
            
            #document-canvas {
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                background: white !important;
            }

            .page-break { page-break-before: always; break-before: page; }
            .avoid-break { page-break-inside: avoid; break-inside: avoid; }
            
            /* Ajustes finos para print */
            .print-padding { padding: 40px !important; }
            .editable-field { border: none !important; background: transparent !important; }
            
            @page { margin: 1.5cm; }
        }

        /* Animaciones suaves UI */
        .slide-in { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="overflow-hidden flex flex-col h-screen">
    <div id="root" class="h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- ICON COMPONENT ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    lucide.createIcons({ icons: { [name]: lucide.icons[name] }, nameAttr: 'data-lucide', attrs: { class: className, width: size, height: size } });
                }
            }, [name, size, className]);
            return <i ref={iconRef} data-lucide={name} className={className}></i>;
        };

        // --- DEFAULT DATA ---
        const initialData = {
            settings: {
                companyName: "Studio Blue",
                companyWeb: "www.studioblue.design",
                clientName: "Acme Corp.",
                clientContact: "Sarah Jenkins, CMO",
                proposalTitle: "Estrategia de Rebranding Digital",
                date: "26 de Marzo, 2026",
                currency: "$",
                taxRate: 21,
                primaryColor: "#2563eb",
                titleFont: "font-serif", // Playfair Display
                bodyFont: "font-source", // Source Sans 3
                logo: "SB."
            },
            blocks: [
                { id: 'b1', type: 'cover', content: { subtitle: "Propuesta comercial y plan de acción." } },
                { id: 'b2', type: 'text', content: { title: "1. Resumen Ejecutivo", text: "En Studio Blue entendemos la necesidad de Acme Corp de reposicionarse en el mercado tecnológico actual. Esta propuesta detalla un rediseño integral de la identidad visual y la plataforma digital, enfocado en aumentar la conversión y modernizar la percepción de marca frente a sus competidores directos.\n\nNuestro enfoque combina investigación de usuarios, diseño de sistemas escalables y una estética premium que resuena con audiencias B2B de alto nivel." } },
                { id: 'b3', type: 'pricing', content: { 
                    title: "2. Inversión Estimada",
                    items: [
                        { id: 'i1', name: "Fase 1: Auditoría y Estrategia", desc: "Análisis de marca actual, benchmark y estrategia de posicionamiento.", qty: 1, price: 2500 },
                        { id: 'i2', name: "Fase 2: Identidad Visual", desc: "Diseño de logo, paleta, tipografía, y manual de marca básico.", qty: 1, price: 4800 },
                        { id: 'i3', name: "Fase 3: Diseño UI/UX Web", desc: "Diseño de 10 pantallas clave, prototipo interactivo y UI Kit.", qty: 1, price: 6500 }
                    ]
                }},
                { id: 'b4', type: 'text', content: { title: "3. Términos y Condiciones", text: "• Validez de la propuesta: 30 días a partir de la fecha de emisión.\n• Forma de pago: 50% al inicio del proyecto, 50% contra entrega final.\n• Propiedad Intelectual: Los derechos patrimoniales se cederán al cliente una vez liquidado el 100% del proyecto.\n• Revisiones: Se incluyen hasta 2 rondas de revisiones por fase." } },
                { id: 'b5', type: 'closing', content: { message: "Estamos listos para transformar tu visión en realidad. Si estás de acuerdo con los términos propuestos, firma a continuación para dar inicio al proyecto.", signer: "Director Creativo" } }
            ]
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [data, setData] = useState(initialData);
            const [activeTab, setActiveTab] = useState('blocks'); // 'blocks' or 'design'

            const updateSettings = (key, value) => {
                setData(prev => ({ ...prev, settings: { ...prev.settings, [key]: value } }));
            };

            const updateBlock = (id, newContent) => {
                setData(prev => ({
                    ...prev,
                    blocks: prev.blocks.map(b => b.id === id ? { ...b, content: { ...b.content, ...newContent } } : b)
                }));
            };

            const addBlock = (type) => {
                const newBlock = { id: `b_${Date.now()}`, type, content: {} };
                if(type === 'text') newBlock.content = { title: "Nueva Sección", text: "Escribe tu contenido aquí..." };
                if(type === 'pricing') newBlock.content = { title: "Presupuesto", items: [{ id: Date.now(), name: "Nuevo Item", desc: "Descripción", qty: 1, price: 0 }] };
                
                setData(prev => ({ ...prev, blocks: [...prev.blocks, newBlock] }));
            };

            const removeBlock = (id) => {
                setData(prev => ({ ...prev, blocks: prev.blocks.filter(b => b.id !== id) }));
            };

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="flex flex-col h-full bg-surface-800 font-sans text-slate-200">
                    {/* TOP NAVBAR (No Print) */}
                    <nav className="no-print h-14 bg-surface-900 border-b border-surface-600 flex items-center justify-between px-6 shrink-0 z-20 shadow-md">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded bg-brand-600 flex items-center justify-center shadow-glow">
                                <Icon name="Layers" size={18} className="text-white" />
                            </div>
                            <span className="font-semibold text-lg tracking-tight text-white">Propose</span>
                            <span className="px-2 py-0.5 ml-4 rounded bg-surface-700 text-xs font-medium text-slate-300 border border-surface-600">Borrador</span>
                        </div>
                        
                        <div className="flex items-center gap-4">
                            <button className="flex items-center gap-2 text-sm text-slate-300 hover:text-white transition-colors">
                                <Icon name="Save" size={16} /> Guardar
                            </button>
                            <button onClick={handlePrint} className="flex items-center gap-2 text-sm bg-surface-700 hover:bg-surface-600 text-white px-4 py-1.5 rounded-md transition-colors border border-surface-600 shadow-sm">
                                <Icon name="Download" size={16} /> Exportar PDF
                            </button>
                            <button onClick={handlePrint} className="flex items-center gap-2 text-sm bg-brand-600 hover:bg-brand-500 text-white px-4 py-1.5 rounded-md transition-all shadow-glow font-medium">
                                <Icon name="Printer" size={16} /> Imprimir
                            </button>
                        </div>
                    </nav>

                    {/* MAIN WORKSPACE */}
                    <div className="flex-1 flex overflow-hidden">
                        
                        {/* LEFT SIDEBAR - BLOCK PALETTE (No Print) */}
                        <aside className="no-print w-64 bg-surface-800 border-r border-surface-600 flex flex-col shrink-0 z-10">
                            <div className="p-4 border-b border-surface-600">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Estructura del Doc</h3>
                                <div className="space-y-2">
                                    {data.blocks.map((block, idx) => (
                                        <div key={block.id} className="flex items-center justify-between p-2 rounded bg-surface-700/50 border border-surface-600 text-sm text-slate-300 group hover:border-brand-500 transition-colors">
                                            <div className="flex items-center gap-2 truncate">
                                                <Icon name={block.type === 'cover' ? 'LayoutTemplate' : block.type === 'text' ? 'AlignLeft' : block.type === 'pricing' ? 'Calculator' : 'CheckSquare'} size={14} className="text-slate-400" />
                                                <span className="truncate">{block.type === 'cover' ? 'Portada' : block.content.title || 'Bloque'}</span>
                                            </div>
                                            <button onClick={() => removeBlock(block.id)} className="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-300 transition-opacity">
                                                <Icon name="Trash2" size={14} />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="p-4 flex-1 overflow-y-auto">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Agregar Bloque</h3>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => addBlock('text')} className="flex flex-col items-center justify-center p-3 rounded-lg bg-surface-900 border border-surface-600 hover:border-brand-500 hover:bg-surface-700 transition-all text-slate-300 hover:text-white group">
                                        <Icon name="AlignLeft" size={20} className="mb-2 text-slate-400 group-hover:text-brand-400" />
                                        <span className="text-xs">Texto</span>
                                    </button>
                                    <button onClick={() => addBlock('pricing')} className="flex flex-col items-center justify-center p-3 rounded-lg bg-surface-900 border border-surface-600 hover:border-brand-500 hover:bg-surface-700 transition-all text-slate-300 hover:text-white group">
                                        <Icon name="Calculator" size={20} className="mb-2 text-slate-400 group-hover:text-brand-400" />
                                        <span className="text-xs">Precios</span>
                                    </button>
                                    <button onClick={() => addBlock('closing')} className="flex flex-col items-center justify-center p-3 rounded-lg bg-surface-900 border border-surface-600 hover:border-brand-500 hover:bg-surface-700 transition-all text-slate-300 hover:text-white group">
                                        <Icon name="PenTool" size={20} className="mb-2 text-slate-400 group-hover:text-brand-400" />
                                        <span className="text-xs">Firma</span>
                                    </button>
                                </div>
                            </div>
                        </aside>

                        {/* CENTER CANVAS - THE DOCUMENT */}
                        <main className="flex-1 bg-surface-900 overflow-y-auto flex justify-center py-10 px-4 scroll-smooth relative">
                            {/* Document Wrapper */}
                            <div 
                                id="document-canvas" 
                                className={`bg-white text-slate-800 shadow-doc min-h-[1122px] w-full max-w-[850px] relative transition-all duration-300 print:shadow-none print:m-0 print:w-full print:max-w-none ${data.settings.bodyFont}`}
                                style={{ '--brand-color': data.settings.primaryColor }}
                            >
                                {data.blocks.map((block, index) => (
                                    <div key={block.id} className={`${index > 0 ? 'page-break' : ''} avoid-break slide-in`}>
                                        {block.type === 'cover' && <CoverBlock data={block.content} settings={data.settings} update={(c) => updateBlock(block.id, c)} />}
                                        {block.type === 'text' && <TextBlock data={block.content} settings={data.settings} update={(c) => updateBlock(block.id, c)} />}
                                        {block.type === 'pricing' && <PricingBlock data={block.content} settings={data.settings} update={(c) => updateBlock(block.id, c)} />}
                                        {block.type === 'closing' && <ClosingBlock data={block.content} settings={data.settings} update={(c) => updateBlock(block.id, c)} />}
                                        {block.type === 'terms' && <TextBlock data={block.content} settings={data.settings} update={(c) => updateBlock(block.id, c)} />}
                                    </div>
                                ))}
                            </div>
                        </main>

                        {/* RIGHT SIDEBAR - SETTINGS (No Print) */}
                        <aside className="no-print w-72 bg-surface-800 border-l border-surface-600 flex flex-col shrink-0 z-10">
                            <div className="flex border-b border-surface-600">
                                <button className={`flex-1 py-3 text-sm font-medium border-b-2 transition-colors ${activeTab === 'blocks' ? 'border-brand-500 text-white bg-surface-700/30' : 'border-transparent text-slate-400 hover:text-slate-200'}`} onClick={() => setActiveTab('blocks')}>Documento</button>
                                <button className={`flex-1 py-3 text-sm font-medium border-b-2 transition-colors ${activeTab === 'design' ? 'border-brand-500 text-white bg-surface-700/30' : 'border-transparent text-slate-400 hover:text-slate-200'}`} onClick={() => setActiveTab('design')}>Branding</button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-5 space-y-6">
                                {activeTab === 'blocks' && (
                                    <div className="space-y-4 slide-in">
                                        <div className="space-y-2">
                                            <label className="text-xs text-slate-400 uppercase tracking-wide font-semibold">Cliente</label>
                                            <input type="text" value={data.settings.clientName} onChange={(e) => updateSettings('clientName', e.target.value)} className="w-full bg-surface-900 border border-surface-600 rounded p-2 text-sm text-white focus:border-brand-500 focus:outline-none transition-colors" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs text-slate-400 uppercase tracking-wide font-semibold">Proyecto / Título</label>
                                            <input type="text" value={data.settings.proposalTitle} onChange={(e) => updateSettings('proposalTitle', e.target.value)} className="w-full bg-surface-900 border border-surface-600 rounded p-2 text-sm text-white focus:border-brand-500 focus:outline-none transition-colors" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs text-slate-400 uppercase tracking-wide font-semibold">Fecha</label>
                                            <input type="text" value={data.settings.date} onChange={(e) => updateSettings('date', e.target.value)} className="w-full bg-surface-900 border border-surface-600 rounded p-2 text-sm text-white focus:border-brand-500 focus:outline-none transition-colors" />
                                        </div>
                                        <hr className="border-surface-600 my-4" />
                                        <div className="space-y-2">
                                            <label className="text-xs text-slate-400 uppercase tracking-wide font-semibold">Moneda</label>
                                            <select value={data.settings.currency} onChange={(e) => updateSettings('currency', e.target.value)} className="w-full bg-surface-900 border border-surface-600 rounded p-2 text-sm text-white focus:border-brand-500 focus:outline-none">
                                                <option value="$">USD ($)</option>
                                                <option value="€">EUR (€)</option>
                                                <option value="£">GBP (£)</option>
                                                <option value="MXN$">MXN ($)</option>
                                            </select>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs text-slate-400 uppercase tracking-wide font-semibold">Impuestos (%)</label>
                                            <input type="number" value={data.settings.taxRate} onChange={(e) => updateSettings('taxRate', parseFloat(e.target.value))} className="w-full bg-surface-900 border border-surface-600 rounded p-2 text-sm text-white focus:border-brand-500 focus:outline-none transition-colors" />
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'design' && (
                                    <div className="space-y-6 slide-in">
                                         <div className="space-y-2">
                                            <label className="text-xs text-slate-400 uppercase tracking-wide font-semibold">Tu Empresa / Logo Texto</label>
                                            <input type="text" value={data.settings.companyName} onChange={(e) => updateSettings('companyName', e.target.value)} className="w-full bg-surface-900 border border-surface-600 rounded p-2 text-sm text-white focus:border-brand-500 focus:outline-none" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs text-slate-400 uppercase tracking-wide font-semibold">Color Principal</label>
                                            <div className="flex gap-2">
                                                <input type="color" value={data.settings.primaryColor} onChange={(e) => updateSettings('primaryColor', e.target.value)} className="w-10 h-10 rounded cursor-pointer bg-surface-900 border border-surface-600 p-1" />
                                                <input type="text" value={data.settings.primaryColor} onChange={(e) => updateSettings('primaryColor', e.target.value)} className="flex-1 bg-surface-900 border border-surface-600 rounded p-2 text-sm text-white focus:border-brand-500 focus:outline-none uppercase font-mono" />
                                            </div>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs text-slate-400 uppercase tracking-wide font-semibold">Tipografía Títulos (PDF)</label>
                                            <select value={data.settings.titleFont} onChange={(e) => updateSettings('titleFont', e.target.value)} className="w-full bg-surface-900 border border-surface-600 rounded p-2 text-sm text-white focus:border-brand-500 focus:outline-none">
                                                <option value="font-serif">Playfair Display (Serif Elegante)</option>
                                                <option value="font-sans">Inter (Moderno Minimal)</option>
                                                <option value="font-manrope">Manrope (Geométrico)</option>
                                            </select>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs text-slate-400 uppercase tracking-wide font-semibold">Tipografía Cuerpo (PDF)</label>
                                            <select value={data.settings.bodyFont} onChange={(e) => updateSettings('bodyFont', e.target.value)} className="w-full bg-surface-900 border border-surface-600 rounded p-2 text-sm text-white focus:border-brand-500 focus:outline-none">
                                                <option value="font-source">Source Sans (Editorial)</option>
                                                <option value="font-sans">Inter (Limpio)</option>
                                            </select>
                                        </div>
                                        
                                        <div className="p-4 bg-brand-900/30 border border-brand-500/30 rounded-lg text-sm text-brand-100 mt-6">
                                            <Icon name="Info" size={16} className="mb-2 text-brand-400" />
                                            Los cambios aquí afectan inmediatamente a la vista previa del documento central y al PDF final exportado.
                                        </div>
                                    </div>
                                )}
                            </div>
                        </aside>
                    </div>
                </div>
            );
        };

        // --- DOCUMENT BLOCKS COMPONENTS ---

        const TextareaAutosize = ({ value, onChange, className, ...props }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current) {
                    ref.current.style.height = 'auto';
                    ref.current.style.height = ref.current.scrollHeight + 'px';
                }
            }, [value]);
            return (
                <textarea
                    ref={ref}
                    value={value}
                    onChange={onChange}
                    className={`editable-field auto-expand ${className}`}
                    rows={1}
                    {...props}
                />
            );
        };

        const CoverBlock = ({ data, settings, update }) => {
            return (
                <div className="relative w-full aspect-[1/1.414] min-h-[1122px] flex flex-col justify-between p-16 print:p-0 print-padding overflow-hidden bg-white group">
                    {/* Elemento de diseño superior */}
                    <div className="absolute top-0 right-0 w-[60%] h-4 bg-[var(--brand-color)] opacity-90"></div>
                    <div className="absolute top-4 right-0 w-[40%] h-2 bg-[var(--brand-color)] opacity-50"></div>

                    {/* Header: Logo y Fecha */}
                    <div className="flex justify-between items-start z-10">
                        <div className="text-3xl font-bold tracking-tighter" style={{ color: settings.primaryColor }}>
                            {settings.logo || settings.companyName}
                        </div>
                        <div className="text-right">
                            <p className="text-sm font-semibold tracking-widest uppercase text-slate-400 mb-1">Fecha</p>
                            <input type="text" value={settings.date} readOnly className="editable-field text-right text-slate-800 font-medium w-32" />
                        </div>
                    </div>

                    {/* Main Content: Títulos */}
                    <div className="z-10 mt-32 mb-auto max-w-2xl">
                        <p className="text-sm font-bold tracking-[0.2em] uppercase mb-6" style={{ color: settings.primaryColor }}>
                            Propuesta Comercial
                        </p>
                        <TextareaAutosize 
                            value={settings.proposalTitle} 
                            readOnly
                            className={`text-5xl md:text-6xl font-bold leading-[1.1] text-slate-900 mb-6 ${settings.titleFont} tracking-tight`}
                        />
                        <TextareaAutosize 
                            value={data.subtitle || ''} 
                            onChange={(e) => update({ subtitle: e.target.value })}
                            placeholder="Añadir un subtítulo descriptivo..."
                            className="text-xl text-slate-500 font-light max-w-lg leading-relaxed"
                        />
                    </div>

                    {/* Footer: Info del cliente */}
                    <div className="border-t-2 border-slate-100 pt-8 flex justify-between items-end z-10">
                        <div>
                            <p className="text-xs font-bold tracking-widest uppercase text-slate-400 mb-2">Preparado para</p>
                            <div className="text-lg font-semibold text-slate-900">{settings.clientName}</div>
                            <div className="text-sm text-slate-500 mt-1">{settings.clientContact}</div>
                        </div>
                        <div className="text-right">
                            <p className="text-xs font-bold tracking-widest uppercase text-slate-400 mb-2">Por</p>
                            <div className="text-lg font-semibold text-slate-900">{settings.companyName}</div>
                            <div className="text-sm text-slate-500 mt-1">{settings.companyWeb}</div>
                        </div>
                    </div>
                    
                    {/* Elemento de diseño fondo (sutil) */}
                    <div className="absolute -bottom-40 -left-40 w-96 h-96 rounded-full mix-blend-multiply opacity-[0.03]" style={{ backgroundColor: settings.primaryColor }}></div>
                </div>
            );
        };

        const TextBlock = ({ data, settings, update }) => {
            return (
                <div className="p-16 print-padding min-h-[500px]">
                    <div className="max-w-3xl mx-auto">
                        <div className="w-12 h-1 mb-8" style={{ backgroundColor: settings.primaryColor }}></div>
                        <input 
                            value={data.title}
                            onChange={(e) => update({ title: e.target.value })}
                            className={`w-full text-3xl font-bold text-slate-900 mb-8 editable-field ${settings.titleFont}`}
                            placeholder="Título de la sección"
                        />
                        <TextareaAutosize 
                            value={data.text}
                            onChange={(e) => update({ text: e.target.value })}
                            className="w-full text-base leading-relaxed text-slate-600 whitespace-pre-wrap editable-field"
                            placeholder="Escribe el contenido aquí..."
                        />
                    </div>
                </div>
            );
        };

        const PricingBlock = ({ data, settings, update }) => {
            const updateItem = (id, field, value) => {
                const newItems = data.items.map(item => item.id === id ? { ...item, [field]: value } : item);
                update({ items: newItems });
            };

            const addItem = () => {
                const newItem = { id: Date.now(), name: "", desc: "", qty: 1, price: 0 };
                update({ items: [...data.items, newItem] });
            };

            const removeItem = (id) => {
                update({ items: data.items.filter(i => i.id !== id) });
            };

            const subtotal = data.items.reduce((sum, item) => sum + (item.qty * item.price), 0);
            const tax = subtotal * (settings.taxRate / 100);
            const total = subtotal + tax;

            const formatCurrency = (val) => {
                return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'USD', currencyDisplay: 'narrowSymbol' })
                    .format(val).replace('$', settings.currency);
            };

            return (
                <div className="p-16 print-padding min-h-[800px]">
                     <div className="max-w-4xl mx-auto">
                        <div className="w-12 h-1 mb-8" style={{ backgroundColor: settings.primaryColor }}></div>
                        <input 
                            value={data.title}
                            onChange={(e) => update({ title: e.target.value })}
                            className={`w-full text-3xl font-bold text-slate-900 mb-10 editable-field ${settings.titleFont}`}
                            placeholder="Título del presupuesto"
                        />

                        {/* Table Header */}
                        <div className="grid grid-cols-12 gap-4 pb-3 border-b-2 border-slate-900 text-sm font-bold tracking-widest uppercase text-slate-900 mb-4">
                            <div className="col-span-6">Concepto / Servicio</div>
                            <div className="col-span-2 text-center">Cant.</div>
                            <div className="col-span-2 text-right">Precio Un.</div>
                            <div className="col-span-2 text-right">Subtotal</div>
                        </div>

                        {/* Table Rows */}
                        <div className="space-y-2 mb-8">
                            {data.items.map((item, idx) => (
                                <div key={item.id} className="grid grid-cols-12 gap-4 py-4 border-b border-slate-100 group relative">
                                    <div className="col-span-6 pr-4">
                                        <input 
                                            value={item.name} 
                                            onChange={(e) => updateItem(item.id, 'name', e.target.value)} 
                                            className="font-bold text-slate-800 w-full editable-field" 
                                            placeholder="Nombre del servicio"
                                        />
                                        <TextareaAutosize 
                                            value={item.desc} 
                                            onChange={(e) => updateItem(item.id, 'desc', e.target.value)} 
                                            className="text-sm text-slate-500 mt-1 w-full editable-field" 
                                            placeholder="Descripción detallada"
                                        />
                                    </div>
                                    <div className="col-span-2">
                                        <input 
                                            type="number" 
                                            value={item.qty} 
                                            onChange={(e) => updateItem(item.id, 'qty', Number(e.target.value))} 
                                            className="text-center w-full text-slate-700 editable-field" 
                                            min="1"
                                        />
                                    </div>
                                    <div className="col-span-2">
                                        <div className="flex items-center justify-end">
                                            <span className="text-slate-400 text-sm mr-1">{settings.currency}</span>
                                            <input 
                                                type="number" 
                                                value={item.price} 
                                                onChange={(e) => updateItem(item.id, 'price', Number(e.target.value))} 
                                                className="text-right w-20 text-slate-700 editable-field" 
                                                min="0"
                                            />
                                        </div>
                                    </div>
                                    <div className="col-span-2 text-right font-medium text-slate-900 py-1 flex items-start justify-end">
                                        {formatCurrency(item.qty * item.price)}
                                        {/* Botón eliminar (solo UI) */}
                                        <button onClick={() => removeItem(item.id)} className="absolute -right-8 top-4 opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 no-print transition-opacity">
                                            <Icon name="XCircle" size={16} />
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Add Row Button (No Print) */}
                        <button onClick={addItem} className="no-print flex items-center gap-2 text-sm text-brand-600 hover:text-brand-800 font-medium mb-12">
                            <Icon name="PlusCircle" size={16} /> Añadir línea de servicio
                        </button>

                        {/* Totals */}
                        <div className="w-full max-w-sm ml-auto space-y-3 text-right">
                            <div className="flex justify-between text-slate-500">
                                <span>Subtotal</span>
                                <span>{formatCurrency(subtotal)}</span>
                            </div>
                            <div className="flex justify-between text-slate-500">
                                <span>Impuestos ({settings.taxRate}%)</span>
                                <span>{formatCurrency(tax)}</span>
                            </div>
                            <div className="flex justify-between items-center pt-4 border-t-2 border-slate-900">
                                <span className={`text-xl font-bold text-slate-900 ${settings.titleFont}`}>Total Final</span>
                                <span className="text-2xl font-bold" style={{ color: settings.primaryColor }}>
                                    {formatCurrency(total)}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ClosingBlock = ({ data, settings, update }) => {
            return (
                <div className="p-16 print-padding min-h-[500px] flex flex-col justify-between bg-slate-50">
                    <div className="max-w-3xl mx-auto w-full">
                        <TextareaAutosize 
                            value={data.message}
                            onChange={(e) => update({ message: e.target.value })}
                            className={`w-full text-2xl leading-relaxed text-slate-800 editable-field ${settings.titleFont} italic mb-16`}
                        />
                        
                        <div className="flex justify-between items-end mt-20">
                            <div className="w-64">
                                <div className="border-b border-slate-400 h-10 mb-2"></div>
                                <p className="font-bold text-slate-900 text-sm">Firma Cliente</p>
                                <p className="text-slate-500 text-xs mt-1">{settings.clientName}</p>
                            </div>
                            <div className="w-64">
                                <div className="border-b border-slate-400 h-10 mb-2 flex items-end justify-center pb-1">
                                    <span className="font-serif text-2xl italic text-slate-800 opacity-80">{settings.companyName}</span>
                                </div>
                                <p className="font-bold text-slate-900 text-sm">Firma Emisor</p>
                                <input 
                                    value={data.signer}
                                    onChange={(e) => update({ signer: e.target.value })}
                                    className="text-slate-500 text-xs mt-1 editable-field w-full"
                                />
                            </div>
                        </div>
                    </div>
                    
                    <div className="mt-20 pt-8 border-t border-slate-200 flex justify-between text-xs text-slate-400 font-medium tracking-wide uppercase">
                        <span>{settings.companyName}</span>
                        <span>{settings.companyWeb}</span>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
