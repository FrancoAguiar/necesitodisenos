<!DOCTYPE html>
<html lang="es" class="scroll-smooth overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>BriefSaaS - Editor</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (para compilar JSX en el navegador) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Google Fonts: Inter, Inter Tight, Kalam, Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800;900&family=Kalam:wght@700&family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- CONFIGURACIÓN TAILWIND (Estética SaaS Azul) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#0066FF',
                            hover: '#0052CC',
                            bg: '#0A0A0A',
                            surface: '#121212',
                            card: '#161616',
                            border: '#262626' 
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Inter Tight', 'sans-serif'],
                        hand: ['Kalam', 'cursive'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow': '0 0 40px -10px rgba(0, 102, 255, 0.4)',
                        'glow-hover': '0 0 50px -5px rgba(0, 102, 255, 0.6)',
                        'sheet': '0 0 0 1px rgba(255,255,255,0.05), 0 20px 40px -10px rgba(0,0,0,0.6)',
                    }
                }
            }
        }
    </script>

    <!-- ESTILOS CSS -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0A;
            color: #E5E5E5;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: rgba(0, 102, 255, 0.3); color: white; }

        h1, h2, h3 { font-family: 'Inter Tight', sans-serif; }

        /* Patrón de fondo SaaS */
        .bg-grid-pattern {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, black 40%, transparent 100%);
            pointer-events: none;
        }

        .bg-ambient-glow {
            position: fixed; top: 10%; left: 50%;
            width: 80vw; height: 80vw; max-width: 800px; max-height: 800px;
            background: radial-gradient(circle, rgba(0, 102, 255, 0.06) 0%, rgba(0,0,0,0) 70%);
            transform: translate(-50%, -50%); pointer-events: none; z-index: 0;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Componentes UI */
        .glass-card {
            background: rgba(22, 22, 24, 0.4);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem; transition: border-color 0.3s ease;
        }
        .glass-card:focus-within { border-color: rgba(0, 102, 255, 0.3); }

        .input-field { 
            background-color: rgba(0,0,0,0.3); border: 1px solid #262626; color: #F4F4F5; 
            padding: 0.65rem 0.85rem; border-radius: 0.5rem; font-size: 0.875rem; 
            transition: all 0.2s; width: 100%; 
        }
        .input-field:focus { 
            outline: none; border-color: #0066FF; 
            box-shadow: 0 0 0 2px rgba(0, 102, 255, 0.2), inset 0 1px 2px rgba(0,0,0,0.5); 
            background-color: rgba(0,0,0,0.5);
        }
        .input-field::placeholder { color: #52525B; }

        @media print {
            body { background: white !important; overflow: auto !important; }
            .bg-grid-pattern, .bg-ambient-glow { display: none !important; }
            .print\:text-black { color: #000 !important; }
            .print\:text-gray-600 { color: #4B5563 !important; }
            .print\:text-gray-500 { color: #6B7280 !important; }
            .print\:text-gray-300 { color: #D1D5DB !important; }
            .print\:bg-white { background-color: #FFF !important; }
            .print\:bg-gray-50 { background-color: #F9FAFB !important; }
            .print\:border-gray-200 { border-color: #E5E7EB !important; border-width: 1px !important; border-style: solid !important; }
            .print\:border-none { border: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:h-screen { height: 100vh !important; }
            .print\:flex { display: flex !important; }
            .print\:flex-col { flex-direction: column !important; }
            .print\:justify-center { justify-content: center !important; }
            .print\:break-before-page { break-before: page !important; page-break-before: always !important; }
            aside, header:not(.mb-24) { display: none !important; }
            main { background: none !important; padding: 0 !important; overflow: visible !important; height: auto !important; }
            .max-w-4xl { max-width: 100% !important; margin: 0 !important; }
            #root { overflow: visible !important; height: auto !important; display: block !important; }
            .flex.h-screen { display: block !important; height: auto !important; overflow: visible !important;}
        }
    </style>
</head>
<body class="bg-brand-bg text-gray-300 font-sans relative min-h-[100dvh]">
    <!-- Fondos de la estética SaaS -->
    <div class="fixed inset-0 bg-grid-pattern pointer-events-none z-0"></div>
    <div class="bg-ambient-glow"></div>

    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_FORM_DATA = {
            brandName: 'Acme Studio',
            slogan: 'Diseñando el futuro digital.',
            shortDesc: 'Somos una agencia de innovación enfocada en crear productos digitales que transforman industrias.',
            longDesc: 'Nuestro enfoque combina diseño centrado en el usuario, ingeniería de software avanzada y estrategias de negocio para lanzar productos escalables y memorables al mercado.',
            values: 'Transparencia, Innovación, Diseño Atemporal',
            benefits: 'Mayor conversión, Retención de usuarios, Percepción premium',
            starProduct: 'Desarrollo de SaaS End-to-End',
            features: ['Diseño UX/UI', 'Arquitectura Cloud', 'Desarrollo Frontend', 'Estrategia de Producto', 'Branding Digital', 'Análisis de Datos'],
            colors: ['#0066FF', '#0A0A0A', '#FFFFFF'],
            services: [
                { id: 1, name: 'Product Design', desc: 'Interfaces modernas y experiencias de usuario sin fricción para aplicaciones complejas.' },
                { id: 2, name: 'Ingeniería Web', desc: 'Desarrollo full-stack utilizando las últimas tecnologías.' }
            ],
            whoAreWe: 'Un equipo de soñadores y creadores.',
            whatWeOffer: 'Soluciones tecnológicas que resuelven problemas reales.',
            mission: 'Elevar el estándar del software global.',
            vision: 'Ser el referente latinoamericano en diseño de producto.',
            references: [
                'https://images.unsplash.com/photo-1618220179428-22790b46a0eb?auto=format&fit=crop&q=80&w=600',
                'https://images.unsplash.com/photo-1600132806370-bf17e65e942f?auto=format&fit=crop&q=80&w=600',
                'https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&q=80&w=600',
                'https://images.unsplash.com/photo-1600607686527-6fb886090705?auto=format&fit=crop&q=80&w=600'
            ]
        };

        const DEFAULT_CONFIG = { moodboardActive: true };

        // === COMPONENTES SEPARADOS PARA EVITAR PERDIDA DE FOCO ===
        // Al estar fuera de App(), no se re-dibujan desde cero en cada tecla pulsada.

        const Input = ({ label, value, onChange, placeholder, isTextarea = false }) => (
            <div className="mb-4">
                <label className="block text-[0.7rem] font-poppins font-semibold uppercase tracking-[0.08em] text-[#A1A1AA] mb-1.5 flex justify-between items-center">{label}</label>
                {isTextarea ? (
                    <textarea 
                        value={value} onChange={onChange} placeholder={placeholder} rows="3"
                        className="input-field resize-none"
                    />
                ) : (
                    <input 
                        type="text" value={value} onChange={onChange} placeholder={placeholder}
                        className="input-field"
                    />
                )}
            </div>
        );

        const Section = ({ title, iconClass, children }) => (
            <div className="glass-card p-4 lg:p-5 mb-6">
                <div className="flex items-center gap-2 mb-4 border-b border-white/5 pb-3">
                    <i className={`ph-fill ${iconClass} text-base text-brand-primary`}></i>
                    <h2 className="text-sm font-bold text-white font-display">{title}</h2>
                </div>
                {children}
            </div>
        );

        const UploadZone = ({ title }) => (
            <div className="border border-dashed border-brand-border hover:border-brand-primary/50 rounded-xl p-8 flex flex-col items-center justify-center text-center cursor-pointer transition-colors bg-black/30 group">
                <div className="w-10 h-10 rounded-full bg-brand-card border border-brand-border flex items-center justify-center mb-3 group-hover:bg-brand-primary/10 transition-colors">
                    <i className="ph-bold ph-upload-simple text-gray-400 group-hover:text-brand-primary"></i>
                </div>
                <p className="text-sm font-medium text-white mb-1 font-poppins">{title}</p>
                <p className="text-xs text-gray-500">Arrastra tus archivos aquí o haz clic</p>
            </div>
        );

        // === APLICACIÓN PRINCIPAL ===
        function App() {
            // --- STATE WITH LOCAL STORAGE ---
            const [config, setConfig] = useState(() => {
                const saved = localStorage.getItem('briefSaaS_config');
                return saved ? JSON.parse(saved) : DEFAULT_CONFIG;
            });

            const [formData, setFormData] = useState(() => {
                const saved = localStorage.getItem('briefSaaS_data');
                return saved ? JSON.parse(saved) : DEFAULT_FORM_DATA;
            });

            // --- EFFECTS FOR AUTOSAVE ---
            useEffect(() => {
                localStorage.setItem('briefSaaS_config', JSON.stringify(config));
            }, [config]);

            useEffect(() => {
                localStorage.setItem('briefSaaS_data', JSON.stringify(formData));
            }, [formData]);

            // --- HANDLERS ---
            const handleChange = (e, field) => {
                setFormData({ ...formData, [field]: e.target.value });
            };

            const handleFeatureChange = (index, value) => {
                const newFeatures = [...formData.features];
                newFeatures[index] = value;
                setFormData({ ...formData, features: newFeatures });
            };

            const addService = () => {
                setFormData({
                    ...formData,
                    services: [...formData.services, { id: Date.now(), name: '', desc: '' }]
                });
            };

            const updateService = (id, field, value) => {
                setFormData({
                    ...formData,
                    services: formData.services.map(s => s.id === id ? { ...s, [field]: value } : s)
                });
            };

            const removeService = (id) => {
                setFormData({
                    ...formData,
                    services: formData.services.filter(s => s.id !== id)
                });
            };

            // RESTART / TRASH HANDLER
            const handleReset = () => {
                if(window.confirm('¿Estás seguro de que quieres borrar todo y empezar de cero? Esto no se puede deshacer.')) {
                    localStorage.removeItem('briefSaaS_data');
                    localStorage.removeItem('briefSaaS_config');
                    setFormData(DEFAULT_FORM_DATA);
                    setConfig(DEFAULT_CONFIG);
                }
            };

            const calculateProgress = () => {
                const fields = [formData.brandName, formData.slogan, formData.shortDesc, formData.mission];
                const filled = fields.filter(f => f && f.length > 0).length;
                return (filled / fields.length) * 100;
            };

            // --- RENDER ---
            return (
                <div className="flex h-screen overflow-hidden selection:bg-brand-primary/30 selection:text-white bg-transparent">
                    
                    {/* LEFT SIDEBAR (FORM) */}
                    <aside className="w-full md:w-[450px] border-r border-brand-border flex flex-col relative z-20 bg-brand-surface/80 backdrop-blur-md shadow-sheet">
                        
                        <div className="p-6 border-b border-brand-border sticky top-0 z-10 bg-brand-bg/60 backdrop-blur">
                            <div className="flex items-center justify-between mb-4">
                                <h1 className="text-white font-display font-bold flex items-center gap-2">
                                    <i className="ph-fill ph-pen-nib text-brand-primary"></i>
                                    Editor de Brief
                                </h1>
                                <span className="text-[10px] text-brand-primary font-bold tracking-wider uppercase">{Math.round(calculateProgress())}% Listo</span>
                            </div>
                            <div className="h-1 bg-brand-card rounded-full overflow-hidden">
                                <div className="h-full transition-all duration-500 ease-out shadow-glow" style={{ width: `${calculateProgress()}%`, backgroundColor: '#0066FF' }}></div>
                            </div>
                        </div>

                        <div className="p-6 overflow-y-auto pb-32 scrollbar-hide">
                            <Section title="Información General" iconClass="ph-text-t">
                                <Input label="Nombre de la Marca" value={formData.brandName} onChange={e => handleChange(e, 'brandName')} placeholder="Ej: Linear" />
                                <Input label="Slogan" value={formData.slogan} onChange={e => handleChange(e, 'slogan')} placeholder="Tu propuesta en una frase" />
                                <Input label="Descripción Corta" value={formData.shortDesc} onChange={e => handleChange(e, 'shortDesc')} isTextarea placeholder="Elevator pitch" />
                                <Input label="Descripción de Servicios/Productos" value={formData.longDesc} onChange={e => handleChange(e, 'longDesc')} isTextarea />
                                <Input label="Producto o Servicio Estrella" value={formData.starProduct} onChange={e => handleChange(e, 'starProduct')} />
                                
                                <div className="mt-6 mb-4">
                                    <label className="block text-[0.7rem] font-poppins font-semibold uppercase tracking-[0.08em] text-[#A1A1AA] mb-2">6 Características Diferenciales</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {[0,1,2,3,4,5].map(i => (
                                            <input key={i} type="text" value={formData.features[i]} onChange={e => handleFeatureChange(i, e.target.value)} placeholder={`Característica ${i+1}`}
                                                className="input-field text-xs" />
                                        ))}
                                    </div>
                                </div>
                                
                                <Input label="Valores de la Empresa" value={formData.values} onChange={e => handleChange(e, 'values')} placeholder="Innovación, Rapidez, Calidad..." />
                                <Input label="Beneficios Principales" value={formData.benefits} onChange={e => handleChange(e, 'benefits')} />
                            </Section>

                            <Section title="Identidad Visual" iconClass="ph-image">
                                <UploadZone title="Subir Logo (SVG, PNG)" />
                                <div className="mt-6">
                                    <label className="block text-[0.7rem] font-poppins font-semibold uppercase tracking-[0.08em] text-[#A1A1AA] mb-2">Colores Principales</label>
                                    <div className="flex gap-3">
                                        {formData.colors.map((color, i) => (
                                            <div key={i} className="w-10 h-10 rounded-full border border-white/10 shadow-sm flex items-center justify-center relative overflow-hidden group cursor-pointer">
                                                <div className="absolute inset-0" style={{ backgroundColor: color }}></div>
                                            </div>
                                        ))}
                                        <div className="w-10 h-10 rounded-full border border-dashed border-gray-600 flex items-center justify-center text-gray-500 hover:border-brand-primary hover:text-brand-primary cursor-pointer transition-colors bg-black/30">
                                            <i className="ph-bold ph-plus"></i>
                                        </div>
                                    </div>
                                </div>
                            </Section>

                            <Section title="Servicios" iconClass="ph-briefcase">
                                {formData.services.map((svc, index) => (
                                    <div key={svc.id} className="mb-4 p-4 border border-brand-border bg-black/30 rounded-lg group relative">
                                        <button onClick={() => removeService(svc.id)} className="absolute top-3 right-3 text-gray-600 hover:text-red-500 transition-colors">
                                            <i className="ph-bold ph-trash"></i>
                                        </button>
                                        <p className="text-[10px] font-bold text-brand-primary uppercase tracking-widest mb-3">Servicio {index + 1}</p>
                                        <Input label="Nombre" value={svc.name} onChange={e => updateService(svc.id, 'name', e.target.value)} />
                                        <Input label="Descripción" value={svc.desc} onChange={e => updateService(svc.id, 'desc', e.target.value)} isTextarea />
                                    </div>
                                ))}
                                <button onClick={addService} className="w-full py-3 rounded-lg border border-dashed border-gray-600 text-gray-400 hover:border-brand-primary hover:text-brand-primary flex items-center justify-center gap-2 text-sm font-bold transition-colors bg-brand-primary/5 hover:bg-brand-primary/10">
                                    <i className="ph-bold ph-plus"></i> Añadir Servicio
                                </button>
                            </Section>

                            <Section title="Nosotros (ADN)" iconClass="ph-file-text">
                                <Input label="¿Quiénes somos?" value={formData.whoAreWe} onChange={e => handleChange(e, 'whoAreWe')} isTextarea />
                                <Input label="¿Qué ofrecemos?" value={formData.whatWeOffer} onChange={e => handleChange(e, 'whatWeOffer')} isTextarea />
                                <Input label="Misión" value={formData.mission} onChange={e => handleChange(e, 'mission')} isTextarea />
                                <Input label="Visión" value={formData.vision} onChange={e => handleChange(e, 'vision')} isTextarea />
                            </Section>

                            <Section title="Referencias y Archivos" iconClass="ph-images">
                                <UploadZone title="Subir Imágenes de Referencia" />
                                <div className="mt-4">
                                    <UploadZone title="Archivos Generales (PDF, ZIP)" />
                                </div>
                            </Section>
                        </div>
                    </aside>


                    {/* RIGHT PANEL (LIVE PREVIEW) */}
                    <main className="flex-1 flex flex-col relative bg-transparent">
                        
                        <header className="h-16 px-8 flex items-center justify-between border-b border-brand-border bg-brand-surface/80 backdrop-blur sticky top-0 left-0 w-full z-10 print:hidden">
                            <div className="flex items-center bg-black/40 border border-white/10 rounded-lg p-1">
                                <button 
                                    onClick={() => setConfig({...config, moodboardActive: true})}
                                    className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all flex items-center gap-2 ${config.moodboardActive ? 'bg-brand-primary text-white shadow-glow' : 'text-gray-400 hover:text-white'}`}
                                >
                                    <i className="ph-bold ph-squares-four"></i> Moodboard
                                </button>
                                <button 
                                    onClick={() => setConfig({...config, moodboardActive: false})}
                                    className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all flex items-center gap-2 ${!config.moodboardActive ? 'bg-brand-primary text-white shadow-glow' : 'text-gray-400 hover:text-white'}`}
                                >
                                    <i className="ph-bold ph-list"></i> Lista
                                </button>
                            </div>

                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={handleReset}
                                    className="p-2 sm:px-3 sm:py-2 bg-black/40 hover:bg-red-500/20 border border-white/10 hover:border-red-500/50 text-gray-400 hover:text-red-400 rounded-lg transition-all flex items-center justify-center"
                                    title="Limpiar y restaurar documento"
                                >
                                    <i className="ph-bold ph-trash text-lg"></i>
                                </button>

                                <button className="px-4 py-2 rounded-lg text-sm font-medium text-brand-primary bg-brand-primary/10 border border-brand-primary/20 hover:bg-brand-primary/20 transition-colors flex items-center gap-2">
                                    <i className="ph-fill ph-check-circle"></i> Guardado
                                </button>

                                <button 
                                    onClick={() => window.print()}
                                    className="flex items-center gap-2 bg-brand-primary text-white hover:bg-brand-hover px-4 py-2 rounded-lg text-sm font-bold transition-all shadow-glow hover:shadow-glow-hover"
                                >
                                    <i className="ph-bold ph-download-simple"></i> Exportar PDF
                                </button>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto pt-[40px] pb-32 px-8 custom-scrollbar">
                            
                            <div className="max-w-4xl mx-auto bg-brand-surface border border-white/5 rounded-2xl p-12 md:p-20 shadow-sheet print:bg-white print:border-none print:shadow-none print:p-0">
                                
                                <header className="mb-24 print:h-screen print:flex print:flex-col print:justify-center print:mb-0">
                                    <div className="inline-block px-3 py-1 rounded-full border border-brand-primary/30 bg-brand-primary/10 text-xs font-poppins font-semibold text-brand-primary tracking-widest mb-8 print:border-gray-200 print:bg-gray-50 print:text-gray-500">
                                        DOCUMENTO GENERADO
                                    </div>
                                    <h1 className="text-5xl md:text-7xl font-bold tracking-tight text-white mb-6 leading-[1.1] print:text-black">
                                        {formData.brandName || 'Sin Título'}
                                    </h1>
                                    <p className="text-xl md:text-2xl text-gray-400 font-light print:text-gray-500">
                                        {formData.slogan || 'Agrega un slogan para tu marca...'}
                                    </p>
                                </header>

                                <section className="mb-20 print:break-before-page">
                                    <h2 className="text-[10px] font-poppins uppercase tracking-[0.2em] text-brand-primary font-bold mb-8 border-b border-white/10 pb-4 print:border-gray-200">
                                        01. El Contexto
                                    </h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                        <div>
                                            <h3 className="text-xl text-white font-bold mb-4 print:text-black">Resumen Ejecutivo</h3>
                                            <p className="text-gray-400 leading-relaxed font-light print:text-gray-600">
                                                {formData.shortDesc || '...'}
                                            </p>
                                            
                                            <div className="mt-8 space-y-6">
                                                <div>
                                                    <h4 className="text-sm font-bold text-white mb-2 print:text-black">Nuestra Misión</h4>
                                                    <p className="text-gray-400 text-sm leading-relaxed print:text-gray-600">{formData.mission}</p>
                                                </div>
                                                <div>
                                                    <h4 className="text-sm font-bold text-white mb-2 print:text-black">Nuestra Visión</h4>
                                                    <p className="text-gray-400 text-sm leading-relaxed print:text-gray-600">{formData.vision}</p>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div className="glass-card p-8 print:bg-gray-50 print:border-gray-200">
                                            <h4 className="text-sm font-bold text-white mb-4 flex items-center gap-2 print:text-black">
                                                <i className="ph-fill ph-star text-brand-primary"></i>
                                                Valores Fundamentales
                                            </h4>
                                            <p className="text-gray-400 text-sm leading-relaxed mb-8 print:text-gray-600">
                                                {formData.values}
                                            </p>
                                            
                                            <h4 className="text-sm font-bold text-white mb-4 flex items-center gap-2 print:text-black">
                                                <i className="ph-fill ph-trend-up text-brand-primary"></i>
                                                Beneficios Clave
                                            </h4>
                                            <p className="text-gray-400 text-sm leading-relaxed print:text-gray-600">
                                                {formData.benefits}
                                            </p>
                                        </div>
                                    </div>
                                </section>

                                <section className="mb-20">
                                    <h2 className="text-[10px] font-poppins uppercase tracking-[0.2em] text-brand-primary font-bold mb-8 border-b border-white/10 pb-4 print:border-gray-200">
                                        02. Diferenciales
                                    </h2>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                        {formData.features.map((feature, idx) => feature && (
                                            <div key={idx} className="glass-card p-6 hover:border-brand-primary/50 transition-colors print:bg-white print:border-gray-200">
                                                <span className="text-3xl font-display font-black text-white/5 mb-4 block print:text-gray-200">0{idx + 1}</span>
                                                <p className="text-white text-sm font-medium print:text-black">{feature}</p>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section className="mb-20 print:break-before-page">
                                    <h2 className="text-[10px] font-poppins uppercase tracking-[0.2em] text-brand-primary font-bold mb-8 border-b border-white/10 pb-4 print:border-gray-200">
                                        03. Arquitectura de Servicios
                                    </h2>
                                    <div className="space-y-4">
                                        {formData.services.map((svc, idx) => (
                                            <div key={idx} className="flex gap-6 p-6 rounded-xl border border-white/5 bg-brand-card print:bg-white print:border-gray-200">
                                                <div className="w-12 h-12 rounded-lg bg-black border border-white/10 flex items-center justify-center shrink-0 print:bg-gray-50 print:border-gray-200 shadow-glow">
                                                    <i className="ph-bold ph-caret-right text-xl text-brand-primary"></i>
                                                </div>
                                                <div>
                                                    <h4 className="text-lg text-white font-bold mb-2 print:text-black">{svc.name || 'Servicio sin nombre'}</h4>
                                                    <p className="text-gray-400 text-sm leading-relaxed print:text-gray-600">{svc.desc || '...'}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section className="print:break-before-page">
                                    <div className="flex justify-between items-end mb-8 border-b border-white/10 pb-4 print:border-gray-200">
                                        <h2 className="text-[10px] font-poppins uppercase tracking-[0.2em] text-brand-primary font-bold">
                                            04. Dirección Visual
                                        </h2>
                                        <div className="flex gap-2">
                                            {formData.colors.map((color, i) => (
                                                <div key={i} className="w-6 h-6 rounded-full border border-white/20 print:border-gray-300" style={{ backgroundColor: color }}></div>
                                            ))}
                                        </div>
                                    </div>

                                    {config.moodboardActive ? (
                                        <div className="grid grid-cols-12 gap-4 auto-rows-[120px] md:auto-rows-[160px]">
                                            <div className="col-span-12 md:col-span-8 row-span-2 overflow-hidden rounded-xl border border-white/10 group print:border-gray-200">
                                                <img src={formData.references[0]} alt="Ref 1" className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                                            </div>
                                            <div className="col-span-6 md:col-span-4 row-span-1 overflow-hidden rounded-xl border border-white/10 group print:border-gray-200">
                                                <img src={formData.references[1]} alt="Ref 2" className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                                            </div>
                                            <div className="col-span-6 md:col-span-4 row-span-2 overflow-hidden rounded-xl border border-white/10 group print:border-gray-200">
                                                <img src={formData.references[2]} alt="Ref 3" className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                                            </div>
                                            <div className="col-span-12 md:col-span-8 row-span-1 overflow-hidden rounded-xl border border-white/10 group print:border-gray-200">
                                                <img src={formData.references[3]} alt="Ref 4" className="w-full h-full object-cover object-top transition-transform duration-700 group-hover:scale-105" />
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            {formData.references.map((ref, idx) => (
                                                <div key={idx} className="flex gap-6 items-center p-4 bg-brand-card border border-white/5 rounded-xl print:bg-white print:border-gray-200">
                                                    <div className="w-32 h-24 overflow-hidden rounded-lg shrink-0">
                                                        <img src={ref} alt={`Ref ${idx}`} className="w-full h-full object-cover" />
                                                    </div>
                                                    <div>
                                                        <h4 className="text-white text-sm font-bold mb-1 print:text-black">Referencia de Estilo {idx + 1}</h4>
                                                        <p className="text-xs text-gray-500 font-mono print:text-gray-500">{ref}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </section>

                                <div className="mt-20 pt-8 border-t border-white/5 flex justify-between items-center select-none w-full print:border-gray-200">
                                    <span class="text-gray-500 text-[10px] font-bold tracking-[0.15em] font-poppins">SAAS BRIEF EDITOR</span>
                                    <div class="flex items-center">
                                        <span class="text-gray-600 text-[10px] font-semibold tracking-[0.15em] font-poppins">CREADO POR</span>
                                        <span class="text-brand-primary text-[10px] font-bold tracking-[0.15em] ml-1.5 font-poppins">@NECESITODISENOS</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
