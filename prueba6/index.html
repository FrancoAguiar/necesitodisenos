<!DOCTYPE html>
<html lang="es" class="scroll-smooth overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>BriefPro | @necesitodisenos</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- html2pdf.js para exportación directa a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- CONFIGURACIÓN TAILWIND (Estética FacturaPro Azul) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#0066FF',
                            hover: '#0052CC',
                            bg: '#0A0A0A',
                            surface: '#121212',
                            card: '#161616',
                            border: '#262626' 
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Inter Tight', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow': '0 0 40px -10px rgba(0, 102, 255, 0.4)',
                        'sheet': '0 0 0 1px rgba(255,255,255,0.05), 0 20px 40px -10px rgba(0,0,0,0.6)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0A;
            color: #E5E5E5;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: rgba(0, 102, 255, 0.3); color: white; }
        h1, h2, h3, h4 { font-family: 'Inter Tight', sans-serif; }

        /* Patrón de fondo y brillos */
        .bg-grid-pattern {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, black 40%, transparent 100%);
            pointer-events: none;
        }
        .bg-ambient-glow {
            position: fixed; top: 10%; left: 50%;
            width: 80vw; height: 80vw; max-width: 800px; max-height: 800px;
            background: radial-gradient(circle, rgba(0, 102, 255, 0.06) 0%, rgba(0,0,0,0) 70%);
            transform: translate(-50%, -50%); pointer-events: none; z-index: 0;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Componentes Base (UI) */
        .glass-card {
            background: rgba(22, 22, 24, 0.4);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem; transition: border-color 0.3s ease;
        }
        .glass-card:focus-within { border-color: rgba(0, 102, 255, 0.3); }

        .input-field { 
            background-color: rgba(0,0,0,0.3); border: 1px solid #262626; color: #F4F4F5; 
            padding: 0.65rem 0.85rem; border-radius: 0.5rem; font-size: 0.875rem; 
            transition: all 0.2s; width: 100%; 
        }
        .input-field:focus { 
            outline: none; border-color: #0066FF; 
            box-shadow: 0 0 0 2px rgba(0, 102, 255, 0.2), inset 0 1px 2px rgba(0,0,0,0.5); 
            background-color: rgba(0,0,0,0.5);
        }
        .input-field::placeholder { color: #52525B; }

        /* Contenedor especial para el Input de Tags (Burbujas) */
        .input-field-wrapper {
            background-color: rgba(0,0,0,0.3); border: 1px solid #262626; color: #F4F4F5; 
            padding: 0.4rem 0.6rem; border-radius: 0.5rem; font-size: 0.875rem; 
            transition: all 0.2s; width: 100%; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; min-height: 46px;
        }
        .input-field-wrapper:focus-within {
            outline: none; border-color: #0066FF; 
            box-shadow: 0 0 0 2px rgba(0, 102, 255, 0.2), inset 0 1px 2px rgba(0,0,0,0.5); 
            background-color: rgba(0,0,0,0.5);
        }

        /* Ajustes precisos para impresión/exportación PDF */
        @media print {
            body { background: #f3f4f6 !important; overflow: auto !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .bg-grid-pattern, .bg-ambient-glow { display: none !important; }
            aside, header.print-hidden { display: none !important; }
            main { background: none !important; padding: 0 !important; overflow: visible !important; height: auto !important; width: 100% !important; }
            .document-container { max-width: 100% !important; margin: 0 !important; box-shadow: none !important; border: none !important; }
            .print\:text-black { color: #000 !important; }
            .print\:text-gray-800 { color: #1f2937 !important; }
            .print\:text-gray-600 { color: #4B5563 !important; }
            .print\:bg-white { background-color: #FFF !important; }
            .print\:bg-gray-50 { background-color: #F9FAFB !important; }
            .print\:border-gray-200 { border-color: #E5E7EB !important; }
            #root { overflow: visible !important; height: auto !important; display: block !important; }
            .flex.h-screen { display: block !important; height: auto !important; overflow: visible !important;}
        }
    </style>
</head>
<body class="bg-brand-bg text-gray-300 font-sans relative min-h-[100dvh]">
    <div class="fixed inset-0 bg-grid-pattern pointer-events-none z-0"></div>
    <div class="bg-ambient-glow"></div>

    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- DATOS POR DEFECTO ---
        const DEFAULT_DATA = {
            // 0. Configuración de Agencia (NUEVO)
            agencyName: '@necesitodisenos',
            agencyWeb: 'www.necesitodisenos.com',
            agencyLogo: null,
            
            // 1. Proyecto & Contexto
            cliente: '',
            proyecto: '',
            descripcion: '',
            historia: '', 
            dolores: '', 
            objetivos: '',
            
            // 2. Audiencia & Mercado
            publico: '',
            competencia: '',
            diferenciador: '',
            
            // 3. Identidad & Tono
            valores: [], 
            tono: [],    
            noHacer: '', 
            colores: ['#0066FF', '#121212', '#FFFFFF'],
            
            // 4. Entregables & Logística
            entregables: [
                { id: 1, nombre: 'Diseño de Logotipo', formato: 'Vectorial (AI, EPS, SVG)' }
            ],
            canales: [], 
            presupuesto: '',
            deadline: '',
            
            // 5. Referencias Visuales
            referencias: [null, null, null, null]
        };

        // --- COMPONENTES UI ---
        const InputField = ({ label, value, onChange, placeholder, isTextarea = false, helperText }) => (
            <div className="mb-5">
                <label className="block text-[0.7rem] font-poppins font-bold uppercase tracking-[0.05em] text-gray-400 mb-1.5">{label}</label>
                {helperText && <p className="text-[11px] text-gray-500 mb-2 leading-tight">{helperText}</p>}
                {isTextarea ? (
                    <textarea value={value} onChange={onChange} placeholder={placeholder} rows="3" className="input-field resize-y min-h-[80px]" />
                ) : (
                    <input type="text" value={value} onChange={onChange} placeholder={placeholder} className="input-field" />
                )}
            </div>
        );

        // Input de Etiquetas (Burbujas) con botón de "+" explícito
        const TagInput = ({ label, tags, onAddTag, onRemoveTag, placeholder, helperText }) => {
            const [inputValue, setInputValue] = useState('');
            const safeTags = Array.isArray(tags) ? tags : []; // Prevención de errores de caché
            
            const handleAdd = () => {
                if (inputValue.trim() !== '') {
                    onAddTag(inputValue.trim());
                    setInputValue('');
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' || e.key === ',') {
                    e.preventDefault(); 
                    handleAdd();
                } else if (e.key === 'Backspace' && inputValue === '' && safeTags.length > 0) {
                    onRemoveTag(safeTags.length - 1);
                }
            };

            return (
                <div className="mb-5">
                    <label className="block text-[0.7rem] font-poppins font-bold uppercase tracking-[0.05em] text-gray-400 mb-1.5">{label}</label>
                    {helperText && <p className="text-[11px] text-gray-500 mb-2 leading-tight">{helperText}</p>}
                    <div className="input-field-wrapper">
                        {safeTags.map((tag, i) => (
                            <span key={i} className="bg-brand-primary text-white text-[11px] px-2.5 py-1 rounded-md flex items-center gap-1.5 font-bold tracking-wide shadow-glow">
                                {tag}
                                <i className="ph-bold ph-x cursor-pointer hover:text-black transition-colors" onClick={() => onRemoveTag(i)}></i>
                            </span>
                        ))}
                        <div className="flex-1 flex min-w-[140px] items-center gap-2">
                            <input
                                type="text"
                                value={inputValue}
                                onChange={e => setInputValue(e.target.value)}
                                onKeyDown={handleKeyDown}
                                className="bg-transparent outline-none text-white text-sm w-full"
                                placeholder={safeTags.length === 0 ? placeholder : "Escribe y presiona +"}
                            />
                            <button 
                                type="button" 
                                onClick={handleAdd} 
                                className="text-gray-400 hover:text-brand-primary transition-colors p-1"
                                title="Agregar"
                            >
                                <i className="ph-bold ph-plus-circle text-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const SectionCard = ({ title, icon, children }) => (
            <div className="glass-card p-5 mb-6">
                <div className="flex items-center gap-2 mb-5 border-b border-white/5 pb-3">
                    <i className={`ph-fill ${icon} text-lg text-brand-primary`}></i>
                    <h2 className="text-sm font-bold text-white font-display tracking-wide">{title}</h2>
                </div>
                {children}
            </div>
        );

        const UploadBox = ({ title, onChange, previewUrl, customClass = "h-28 w-full", imageClass = "object-cover" }) => (
            <div className={`relative border border-dashed border-brand-border hover:border-brand-primary/50 rounded-lg overflow-hidden flex flex-col items-center justify-center text-center cursor-pointer transition-colors bg-black/30 group mb-2 ${customClass}`}>
                <input type="file" accept="image/*" onChange={onChange} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                {previewUrl ? (
                    <img src={previewUrl} className={`w-full h-full group-hover:scale-105 transition-transform duration-300 ${imageClass}`} alt="Preview" />
                ) : (
                    <div className="flex flex-col items-center p-3">
                        <i className="ph-bold ph-image text-2xl text-gray-500 group-hover:text-brand-primary mb-1 transition-colors"></i>
                        <p className="text-[10px] font-medium text-gray-400 uppercase tracking-widest">{title}</p>
                    </div>
                )}
            </div>
        );

        // --- APP PRINCIPAL ---
        function App() {
            // Estado y LocalStorage 
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem('briefPro_data_v4');
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch (e) {
                        return DEFAULT_DATA;
                    }
                }
                return DEFAULT_DATA;
            });

            const [isExporting, setIsExporting] = useState(false);

            // FIX DE BUG DE IMÁGENES: Try/Catch para evitar crasheos si el base64 es muy grande
            useEffect(() => {
                try {
                    localStorage.setItem('briefPro_data_v4', JSON.stringify(data));
                } catch (e) {
                    console.warn("Exceso de cuota en localStorage. Guardando datos sin imágenes...");
                    const safeData = { ...data, referencias: [null, null, null, null] };
                    localStorage.setItem('briefPro_data_v4', JSON.stringify(safeData));
                }
            }, [data]);

            // Handlers Genéricos
            const handleChange = (field, value) => setData(prev => ({ ...prev, [field]: value }));

            // Handlers Arrays (Tags)
            const handleAddTag = (field, value) => {
                if (!Array.isArray(data[field])) {
                    setData(prev => ({ ...prev, [field]: [value] }));
                    return;
                }
                if (!data[field].includes(value)) {
                    setData(prev => ({ ...prev, [field]: [...prev[field], value] }));
                }
            };
            const handleRemoveTag = (field, indexToRemove) => {
                setData(prev => ({ ...prev, [field]: prev[field].filter((_, i) => i !== indexToRemove) }));
            };

            // Handlers Colores
            const addColor = (e) => {
                const newColor = e.target.value;
                if (!data.colores.includes(newColor)) {
                    setData(prev => ({ ...prev, colores: [...prev.colores, newColor] }));
                }
            };
            const removeColor = (indexToRemove) => {
                setData(prev => ({ ...prev, colores: prev.colores.filter((_, index) => index !== indexToRemove) }));
            };

            // Handlers Entregables
            const addEntregable = () => setData(prev => ({ ...prev, entregables: [...prev.entregables, { id: Date.now(), nombre: '', formato: '' }] }));
            const updateEntregable = (id, field, value) => setData(prev => ({ ...prev, entregables: prev.entregables.map(item => item.id === id ? { ...item, [field]: value } : item) }));
            const removeEntregable = (id) => setData(prev => ({ ...prev, entregables: prev.entregables.filter(item => item.id !== id) }));

            // Handlers Imágenes Agencia
            const handleAgencyLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => handleChange('agencyLogo', ev.target.result);
                    reader.readAsDataURL(file);
                }
            };
            const removeAgencyLogo = (e) => {
                e.stopPropagation();
                handleChange('agencyLogo', null);
            };

            // Handlers Imágenes Referencia
            const handleImageUpload = (e, index) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const newRefs = [...data.referencias];
                        newRefs[index] = ev.target.result;
                        setData(prev => ({ ...prev, referencias: newRefs }));
                    };
                    reader.readAsDataURL(file);
                }
            };
            const removeImage = (e, index) => {
                e.stopPropagation();
                const newRefs = [...data.referencias];
                newRefs[index] = null;
                setData(prev => ({ ...prev, referencias: newRefs }));
            };

            // Reiniciar TODO
            const handleReset = () => {
                if (window.confirm('¿Seguro que deseas limpiar todo el brief? Esta acción no se puede deshacer.')) {
                    localStorage.removeItem('briefPro_data_v4');
                    setData(DEFAULT_DATA);
                }
            };

            // Descargar PDF como UNA SOLA IMAGEN / PÁGINA
            const handleExportPDF = () => {
                setIsExporting(true);
                const element = document.getElementById('document-to-export');
                
                // Calculamos dimensiones actuales para que sea de 1 sola página
                const w = element.offsetWidth;
                const h = element.offsetHeight;

                const opt = {
                    margin:       0,
                    filename:     `Brief_${data.cliente || 'Cliente'}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true, logging: false, width: w, height: h },
                    // Unidad en pixeles y formato ajustado al ancho y alto del contenedor
                    jsPDF:        { unit: 'px', format: [w, h], orientation: 'portrait' }
                };
                
                html2pdf().set(opt).from(element).save().then(() => {
                    setIsExporting(false);
                });
            };

            // Progreso
            const calculateProgress = () => {
                const requiredFields = [data.cliente, data.proyecto, data.descripcion, data.objetivos, data.publico];
                const filled = requiredFields.filter(f => f && f.trim().length > 0).length;
                return Math.round((filled / requiredFields.length) * 100);
            };

            // Helpers para UI
            const hasReferences = data.referencias.some(ref => ref !== null);

            return (
                <div className="flex h-screen overflow-hidden bg-transparent">
                    
                    {/* PANEL IZQUIERDO: FORMULARIO DEL DISEÑADOR */}
                    <aside className="w-full md:w-[480px] border-r border-brand-border flex flex-col relative z-20 bg-brand-surface/80 backdrop-blur-md shadow-sheet">
                        
                        {/* Header Panel Lateral */}
                        <div className="p-5 border-b border-brand-border sticky top-0 z-10 bg-brand-bg/90 backdrop-blur">
                            <div className="flex items-center justify-between mb-3">
                                <div className="flex flex-col">
                                    <h1 className="text-white font-display font-bold flex items-center gap-2 text-lg tracking-tight">
                                        <div className="p-1.5 bg-brand-primary rounded-md shadow-glow">
                                            <i className="ph-bold ph-notebook text-white text-sm"></i>
                                        </div>
                                        Briefing Creator
                                    </h1>
                                    <span className="text-[10px] text-gray-500 font-poppins mt-1">{data.agencyName || '@agencia'} • Herramienta Interna</span>
                                </div>
                                <span className="text-[10px] text-brand-primary font-bold tracking-wider uppercase bg-brand-primary/10 border border-brand-primary/20 px-2 py-1 rounded">{calculateProgress()}%</span>
                            </div>
                            <div className="h-1 bg-brand-card rounded-full overflow-hidden">
                                <div className="h-full transition-all duration-500 ease-out shadow-glow" style={{ width: `${calculateProgress()}%`, backgroundColor: '#0066FF' }}></div>
                            </div>
                        </div>

                        {/* Contenido Formularios */}
                        <div className="p-6 overflow-y-auto pb-32 scrollbar-hide">
                            
                            <SectionCard title="Configuración de Agencia" icon="ph-gear">
                                <p className="text-[10px] text-gray-500 mb-4 leading-relaxed">Personaliza el documento con la identidad de tu propio estudio. Estos datos aparecerán en los encabezados y pies de página.</p>
                                
                                <div className="mb-5">
                                    <label className="block text-[0.7rem] font-poppins font-bold uppercase tracking-[0.05em] text-gray-400 mb-1.5">Logo del Estudio / Agencia</label>
                                    <div className="relative group w-max">
                                        <UploadBox title="Subir Logo" previewUrl={data.agencyLogo} onChange={handleAgencyLogoUpload} customClass="h-20 w-32" imageClass="object-contain p-2" />
                                        {data.agencyLogo && (
                                            <button onClick={removeAgencyLogo} className="absolute -top-2 -right-2 w-5 h-5 bg-red-500/90 hover:bg-red-600 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20 shadow-md">
                                                <i className="ph-bold ph-x text-[10px]"></i>
                                            </button>
                                        )}
                                    </div>
                                </div>

                                <InputField label="Nombre o @Usuario" value={data.agencyName} onChange={e => handleChange('agencyName', e.target.value)} placeholder="Ej: @necesitodisenos" />
                                <InputField label="Sitio Web / Portafolio" value={data.agencyWeb} onChange={e => handleChange('agencyWeb', e.target.value)} placeholder="Ej: www.necesitodisenos.com" />
                            </SectionCard>

                            <SectionCard title="Proyecto & Contexto" icon="ph-folder-star">
                                <InputField label="Nombre del Cliente / Empresa" value={data.cliente} onChange={e => handleChange('cliente', e.target.value)} placeholder="Ej: Acme Corp" />
                                <InputField label="Nombre del Proyecto" value={data.proyecto} onChange={e => handleChange('proyecto', e.target.value)} placeholder="Ej: Rebranding 2024" />
                                <InputField label="Historia / Contexto de la Empresa" helperText="Un breve background para entender de dónde vienen." value={data.historia} onChange={e => handleChange('historia', e.target.value)} isTextarea placeholder="Fundados en 2015, comenzaron como..." />
                                <InputField label="Descripción General del Proyecto" value={data.descripcion} onChange={e => handleChange('descripcion', e.target.value)} isTextarea placeholder="El cliente necesita rediseñar su..." />
                                <InputField label="Dolores del Cliente (Pain Points)" helperText="¿Qué problema real vienen a resolver con nosotros hoy?" value={data.dolores} onChange={e => handleChange('dolores', e.target.value)} isTextarea placeholder="Su imagen actual se ve anticuada y no atrae a..." />
                                <InputField label="Objetivos Principales" helperText="¿Qué debemos alcanzar con este diseño?" value={data.objetivos} onChange={e => handleChange('objetivos', e.target.value)} isTextarea placeholder="Modernizar marca, comunicar lujo, etc." />
                            </SectionCard>

                            <SectionCard title="Audiencia & Mercado" icon="ph-users-three">
                                <InputField label="Público Objetivo" helperText="Edad, intereses, ubicación, nivel socioeconómico." value={data.publico} onChange={e => handleChange('publico', e.target.value)} isTextarea />
                                <InputField label="Competidores (Directos/Aspiracionales)" helperText="Nombres de marcas o links a sus webs/redes." value={data.competencia} onChange={e => handleChange('competencia', e.target.value)} isTextarea />
                                <InputField label="Diferenciador (Propuesta de Valor)" helperText="¿Qué hace única a la marca frente a esa competencia?" value={data.diferenciador} onChange={e => handleChange('diferenciador', e.target.value)} isTextarea />
                            </SectionCard>

                            <SectionCard title="Identidad, Tono y Restricciones" icon="ph-palette">
                                <TagInput 
                                    label="Valores de la Marca" 
                                    helperText="Escribe una palabra y presiona Enter o el botón +" 
                                    placeholder="Ej: Innovación, Lujo..." 
                                    tags={data.valores} 
                                    onAddTag={(val) => handleAddTag('valores', val)} 
                                    onRemoveTag={(idx) => handleRemoveTag('valores', idx)} 
                                />
                                
                                <TagInput 
                                    label="Tono de Voz / Personalidad" 
                                    helperText="¿Cómo habla la marca? (Ej: Cercano, Corporativo)" 
                                    placeholder="Escribe y presiona Enter o el botón +" 
                                    tags={data.tono} 
                                    onAddTag={(val) => handleAddTag('tono', val)} 
                                    onRemoveTag={(idx) => handleRemoveTag('tono', idx)} 
                                />

                                <InputField label="Restricciones (Lo que NO hacer)" helperText="Colores odiados, clichés a evitar, estilos prohibidos." value={data.noHacer} onChange={e => handleChange('noHacer', e.target.value)} isTextarea placeholder="Evitar colores neón, no usar tipografía serif..." />
                                
                                <div className="mb-2 mt-4">
                                    <label className="block text-[0.7rem] font-poppins font-bold uppercase tracking-[0.05em] text-gray-400 mb-3">Paleta de Colores Sugerida</label>
                                    <div className="flex flex-wrap gap-3">
                                        {data.colores.map((color, index) => (
                                            <div key={index} className="relative group">
                                                <div className="w-10 h-10 rounded-full border-2 border-white/10 shadow-sm flex items-center justify-center relative overflow-hidden">
                                                    <div className="absolute inset-0" style={{ backgroundColor: color }}></div>
                                                </div>
                                                <button onClick={() => removeColor(index)} className="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white rounded-full text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <i className="ph-bold ph-x"></i>
                                                </button>
                                            </div>
                                        ))}
                                        <div className="relative w-10 h-10 rounded-full border-2 border-dashed border-gray-600 flex items-center justify-center text-gray-500 hover:border-brand-primary hover:text-brand-primary cursor-pointer transition-colors bg-black/30 overflow-hidden group">
                                            <i className="ph-bold ph-plus group-hover:scale-110 transition-transform"></i>
                                            <input type="color" onChange={addColor} className="absolute inset-[-10px] w-[50px] h-[50px] opacity-0 cursor-pointer" />
                                        </div>
                                    </div>
                                    <p className="text-[10px] text-gray-500 mt-3 font-mono">Selector nativo: Click en el "+" para añadir color.</p>
                                </div>
                            </SectionCard>

                            <SectionCard title="Alcance, Logística y Canales" icon="ph-package">
                                <TagInput 
                                    label="Canales de Distribución" 
                                    helperText="¿Dónde va a vivir este diseño? (Instagram, Web, Print...)" 
                                    placeholder="Ej: Redes Sociales..." 
                                    tags={data.canales} 
                                    onAddTag={(val) => handleAddTag('canales', val)} 
                                    onRemoveTag={(idx) => handleRemoveTag('canales', idx)} 
                                />

                                <div className="mb-5 space-y-4">
                                    <label className="block text-[0.7rem] font-poppins font-bold uppercase tracking-[0.05em] text-gray-400 mb-1.5">Entregables Finales</label>
                                    {data.entregables.map((item, index) => (
                                        <div key={item.id} className="p-4 bg-black/40 border border-brand-border rounded-lg relative group">
                                            {data.entregables.length > 1 && (
                                                <button onClick={() => removeEntregable(item.id)} className="absolute top-2 right-2 text-gray-600 hover:text-red-500 transition-colors">
                                                    <i className="ph-bold ph-trash text-base"></i>
                                                </button>
                                            )}
                                            <span className="text-[10px] text-brand-primary font-bold uppercase tracking-widest mb-2 block">Item {index + 1}</span>
                                            <div className="space-y-3">
                                                <input type="text" value={item.nombre} onChange={e => updateEntregable(item.id, 'nombre', e.target.value)} placeholder="Ej: Diseño de Logotipo" className="input-field py-2 text-sm text-white font-medium border-none bg-transparent px-0 focus:ring-0 focus:border-transparent border-b border-white/10 rounded-none w-[90%]" />
                                                <input type="text" value={item.formato} onChange={e => updateEntregable(item.id, 'formato', e.target.value)} placeholder="Formato: Vectorial, PNG, Web..." className="input-field py-2 text-xs text-gray-400 bg-white/5 border-transparent" />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={addEntregable} className="w-full py-2.5 rounded-lg border border-dashed border-brand-primary/40 text-brand-primary hover:bg-brand-primary/10 flex items-center justify-center gap-2 text-xs font-bold transition-colors">
                                    <i className="ph-bold ph-plus"></i> Añadir Entregable
                                </button>

                                <div className="grid grid-cols-2 gap-4 mt-6">
                                    <InputField label="Presupuesto" value={data.presupuesto} onChange={e => handleChange('presupuesto', e.target.value)} placeholder="Ej: $1,500 USD" />
                                    <InputField label="Deadline Final" value={data.deadline} onChange={e => handleChange('deadline', e.target.value)} placeholder="Ej: 15 Oct 2024" />
                                </div>
                            </SectionCard>

                            <SectionCard title="Referencias (Moodboard)" icon="ph-images">
                                <p className="text-[10px] text-gray-500 mb-4">Sube imágenes de referencia visual, inspiración o materiales que te ayuden a guiar el diseño (máximo 4 para optimizar autoguardado).</p>
                                <div className="grid grid-cols-2 gap-3">
                                    {data.referencias.map((refUrl, index) => (
                                        <div key={index} className="relative group">
                                            <UploadBox title={`Ref ${index + 1}`} previewUrl={refUrl} onChange={(e) => handleImageUpload(e, index)} />
                                            {refUrl && (
                                                <button onClick={(e) => removeImage(e, index)} className="absolute top-1 right-1 w-6 h-6 bg-red-500/90 hover:bg-red-600 text-white rounded flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20 shadow-md">
                                                    <i className="ph-bold ph-trash text-xs"></i>
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </SectionCard>

                            {/* --- MARCA DE AGUA INFERIOR (FORMULARIO) --- */}
                            <div className="mt-8 pt-4 border-t border-brand-border flex justify-center items-center select-none w-full opacity-80 pb-2">
                                <span className="text-[#737373] text-[11px] font-semibold tracking-[0.15em] font-poppins">CREADO POR</span>
                                <span className="text-brand-primary text-[11px] font-bold tracking-[0.15em] ml-1.5 font-poppins">@NECESITODISENOS</span>
                            </div>

                        </div>
                    </aside>


                    {/* PANEL DERECHO: DOCUMENTO GENERADO (LIVE PREVIEW) */}
                    <main className="flex-1 flex flex-col relative bg-transparent overflow-hidden">
                        
                        {/* Header Preview */}
                        <header className="h-16 px-8 flex items-center justify-between border-b border-brand-border bg-brand-surface/80 backdrop-blur sticky top-0 left-0 w-full z-10 print-hidden">
                            <div className="flex items-center gap-3 text-sm font-medium text-gray-400">
                                <i className="ph-fill ph-eye"></i> Vista del Documento
                            </div>

                            <div className="flex items-center gap-3">
                                <button onClick={handleReset} className="p-2.5 bg-black/40 hover:bg-red-500/10 border border-white/10 hover:border-red-500/30 text-gray-400 hover:text-red-400 rounded-lg transition-all" title="Limpiar todo el documento">
                                    <i className="ph-bold ph-trash text-lg"></i>
                                </button>
                                <button 
                                    onClick={handleExportPDF} 
                                    disabled={isExporting}
                                    className="flex items-center gap-2 bg-brand-primary text-white hover:bg-brand-hover px-5 py-2.5 rounded-lg text-sm font-bold transition-all shadow-glow hover:shadow-glow-hover disabled:opacity-50"
                                >
                                    <i className={`ph-bold ${isExporting ? 'ph-spinner animate-spin' : 'ph-export'}`}></i> 
                                    {isExporting ? 'Generando...' : 'Exportar PDF'}
                                </button>
                            </div>
                        </header>

                        {/* El Documento (A4 style / One Page) */}
                        <div className="flex-1 overflow-y-auto py-10 px-4 lg:px-10 custom-scrollbar">
                            
                            <div id="document-to-export" className="document-container max-w-[850px] mx-auto bg-white border border-gray-200 rounded-xl shadow-xl min-h-[1000px] overflow-hidden text-gray-900 print:bg-white print:border-none print:shadow-none print:m-0 print:p-0">
                                
                                {/* CABECERA DOCUMENTO */}
                                <div className="bg-gray-50 border-b border-gray-200 p-10 md:p-14">
                                    <div className="flex justify-between items-start mb-16">
                                        <div>
                                            <h4 className="text-[10px] font-poppins font-bold uppercase tracking-[0.2em] text-brand-primary mb-2">Documento Interno</h4>
                                            <h1 className="text-4xl md:text-5xl font-display font-black tracking-tight text-black mb-2 leading-none break-words">
                                                Project Brief
                                            </h1>
                                            <p className="text-gray-500 font-mono text-sm break-words">Creado por {data.agencyName || '@tuagencia'}</p>
                                        </div>
                                        <div className="text-right flex flex-col items-end gap-4">
                                            {data.agencyLogo && (
                                                <img src={data.agencyLogo} alt="Logo Agencia" className="max-h-12 max-w-[150px] object-contain" />
                                            )}
                                            <div>
                                                <p className="text-[10px] font-poppins font-bold uppercase tracking-widest text-gray-400 mb-1">Cliente</p>
                                                <p className="font-bold text-lg text-black break-words">{data.cliente || 'Nombre del Cliente'}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white border border-gray-200 p-6 rounded-xl shadow-sm">
                                        <p className="text-[10px] font-poppins font-bold uppercase tracking-widest text-gray-400 mb-1">Proyecto</p>
                                        <h2 className="text-2xl font-bold text-brand-primary mb-3 break-words">{data.proyecto || 'Título del Proyecto'}</h2>
                                        <p className="text-gray-600 text-sm leading-relaxed whitespace-pre-line break-words break-all">
                                            {data.descripcion || 'Descripción general no definida.'}
                                        </p>
                                    </div>
                                </div>

                                {/* CUERPO DOCUMENTO */}
                                <div className="p-10 md:p-14 space-y-12">
                                    
                                    {/* Nueva Sección: Contexto & Dolores */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div>
                                            <h3 className="text-xs font-poppins font-bold uppercase tracking-widest text-black border-b-2 border-gray-200 pb-2 mb-4 inline-block">Contexto / Historia</h3>
                                            <p className="text-sm text-gray-600 leading-relaxed whitespace-pre-line break-words break-all">{data.historia || '...'}</p>
                                        </div>
                                        <div className="bg-red-50 p-5 rounded-xl border border-red-100">
                                            <h3 className="text-xs font-poppins font-bold uppercase tracking-widest text-red-600 mb-2 flex items-center gap-2"><i className="ph-fill ph-warning-circle"></i> Dolores a Resolver</h3>
                                            <p className="text-sm text-red-900 leading-relaxed whitespace-pre-line break-words break-all">{data.dolores || '...'}</p>
                                        </div>
                                    </div>

                                    {/* Grid: Objetivos & Diferenciador */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div>
                                            <h3 className="text-xs font-poppins font-bold uppercase tracking-widest text-black border-b-2 border-brand-primary pb-2 mb-4 inline-block">Objetivos del Diseño</h3>
                                            <p className="text-sm text-gray-600 leading-relaxed whitespace-pre-line break-words break-all">{data.objetivos || '...'}</p>
                                        </div>
                                        <div>
                                            <h3 className="text-xs font-poppins font-bold uppercase tracking-widest text-black border-b-2 border-brand-primary pb-2 mb-4 inline-block">Diferenciador</h3>
                                            <p className="text-sm text-gray-600 leading-relaxed whitespace-pre-line break-words break-all">{data.diferenciador || '...'}</p>
                                        </div>
                                    </div>

                                    {/* Background Card: Audiencia & Competencia */}
                                    <div className="bg-gray-50 rounded-xl p-8 border border-gray-100">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                            <div>
                                                <div className="flex items-center gap-2 mb-3">
                                                    <div className="w-6 h-6 rounded bg-brand-primary/10 flex items-center justify-center text-brand-primary"><i className="ph-fill ph-users"></i></div>
                                                    <h3 className="text-sm font-bold text-black font-display">Público Objetivo</h3>
                                                </div>
                                                <p className="text-sm text-gray-600 leading-relaxed whitespace-pre-line break-words break-all">{data.publico || '...'}</p>
                                            </div>
                                            <div>
                                                <div className="flex items-center gap-2 mb-3">
                                                    <div className="w-6 h-6 rounded bg-gray-200 flex items-center justify-center text-gray-600"><i className="ph-fill ph-crosshair"></i></div>
                                                    <h3 className="text-sm font-bold text-black font-display">Competencia</h3>
                                                </div>
                                                <p className="text-sm text-gray-600 leading-relaxed whitespace-pre-line break-words break-all">{data.competencia || '...'}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Identidad */}
                                    <div className="border-t border-gray-200 pt-8 mt-8">
                                        <h3 className="text-xs font-poppins font-bold uppercase tracking-widest text-black border-b border-gray-200 pb-2 mb-6">Identidad & Dirección</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                            
                                            {/* Renderizado en Burbujas para Preview */}
                                            <div className="col-span-2 md:col-span-1">
                                                <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Valores Clave</p>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {(Array.isArray(data.valores) && data.valores.length > 0) ? data.valores.map((v, i) => (
                                                        <span key={i} className="px-2 py-1 bg-gray-100 text-gray-700 text-xs font-bold rounded-md border border-gray-200 break-words">{v}</span>
                                                    )) : <span className="text-gray-400 text-sm">-</span>}
                                                </div>
                                            </div>
                                            
                                            <div className="col-span-2 md:col-span-1">
                                                <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Tono de Voz</p>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {(Array.isArray(data.tono) && data.tono.length > 0) ? data.tono.map((t, i) => (
                                                        <span key={i} className="px-2 py-1 bg-gray-100 text-gray-700 text-xs font-bold rounded-md border border-gray-200 break-words">{t}</span>
                                                    )) : <span className="text-gray-400 text-sm">-</span>}
                                                </div>
                                            </div>

                                            <div className="col-span-2 md:col-span-1">
                                                <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Lo que NO hacer</p>
                                                <p className="font-medium text-red-600 text-xs whitespace-pre-line break-words break-all">{data.noHacer || '-'}</p>
                                            </div>

                                            <div className="col-span-2 md:col-span-1">
                                                <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Paleta Sugerida</p>
                                                <div className="flex gap-1.5 flex-wrap">
                                                    {data.colores.map((color, i) => (
                                                        <div key={i} className="w-6 h-6 rounded-full border border-gray-300 shadow-sm" style={{ backgroundColor: color }} title={color}></div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Entregables */}
                                    <div>
                                        <h3 className="text-xs font-poppins font-bold uppercase tracking-widest text-black border-b border-gray-200 pb-2 mb-6">Alcance y Entregables</h3>
                                        
                                        {/* Burbujas Canales */}
                                        <div className="mb-6">
                                            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Canales de Distribución</p>
                                            <div className="flex flex-wrap gap-2">
                                                {(Array.isArray(data.canales) && data.canales.length > 0) ? data.canales.map((c, i) => (
                                                    <span key={i} className="px-2.5 py-1 bg-brand-primary/10 text-brand-primary text-xs font-bold rounded-md border border-brand-primary/20 break-words">{c}</span>
                                                )) : <span className="text-gray-400 text-sm">-</span>}
                                            </div>
                                        </div>

                                        <table className="w-full text-left border-collapse mb-6">
                                            <thead>
                                                <tr className="bg-gray-50 border-b border-gray-200">
                                                    <th className="py-3 px-4 text-xs font-bold text-gray-500 uppercase tracking-widest w-12 text-center">#</th>
                                                    <th className="py-3 px-4 text-xs font-bold text-gray-500 uppercase tracking-widest">Item a entregar</th>
                                                    <th className="py-3 px-4 text-xs font-bold text-gray-500 uppercase tracking-widest">Especificaciones / Formato</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {data.entregables.filter(e => e.nombre || e.formato).map((item, idx) => (
                                                    <tr key={item.id} className="border-b border-gray-100 last:border-0">
                                                        <td className="py-4 px-4 text-xs font-bold text-gray-400 text-center">{idx + 1}</td>
                                                        <td className="py-4 px-4 text-sm font-bold text-black break-words">{item.nombre || '-'}</td>
                                                        <td className="py-4 px-4 text-sm text-gray-600 break-words">{item.formato || '-'}</td>
                                                    </tr>
                                                ))}
                                                {data.entregables.filter(e => e.nombre || e.formato).length === 0 && (
                                                    <tr><td colSpan="3" className="py-4 text-center text-sm text-gray-400 italic">No se han definido entregables.</td></tr>
                                                )}
                                            </tbody>
                                        </table>

                                        <div className="flex justify-end gap-8 bg-brand-primary text-white p-4 rounded-lg">
                                            <div className="text-right">
                                                <p className="text-[10px] font-bold text-white/70 uppercase tracking-widest">Deadline Final</p>
                                                <p className="font-bold text-lg break-words">{data.deadline || 'Por definir'}</p>
                                            </div>
                                            <div className="w-px bg-white/20"></div>
                                            <div className="text-right pr-4">
                                                <p className="text-[10px] font-bold text-white/70 uppercase tracking-widest">Presupuesto</p>
                                                <p className="font-bold text-lg break-words">{data.presupuesto || 'Por definir'}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Moodboard */}
                                    {hasReferences && (
                                        <div>
                                            <h3 className="text-xs font-poppins font-bold uppercase tracking-widest text-black border-b border-gray-200 pb-2 mb-6">Referencias (Moodboard)</h3>
                                            <div className="grid grid-cols-2 gap-4 auto-rows-[160px] md:auto-rows-[200px]">
                                                {data.referencias.map((ref, idx) => ref && (
                                                    <div key={idx} className="rounded-xl overflow-hidden border border-gray-200 shadow-sm bg-gray-50 flex items-center justify-center">
                                                        <img src={ref} alt={`Referencia ${idx+1}`} className="w-full h-full object-cover" />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                </div>

                                {/* Footer Documento */}
                                <div className="bg-gray-900 text-white p-8 mt-12 rounded-b-xl print:rounded-none">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <p className="font-bold text-lg font-display mb-1 break-words">Documento Confidencial</p>
                                            <p className="text-xs text-gray-400 font-mono break-words">Generado el {new Date().toLocaleDateString()}</p>
                                        </div>
                                        <div className="text-right flex items-center gap-4">
                                            <div className="flex flex-col items-end">
                                                <p className="text-[10px] font-bold text-brand-primary uppercase tracking-widest mb-1 font-poppins">ESTUDIO / AGENCIA</p>
                                                <p className="font-bold text-white mb-0.5 break-words">{data.agencyName || '@tuagencia'}</p>
                                                {data.agencyWeb && <p className="text-xs text-gray-400 font-mono break-words">{data.agencyWeb}</p>}
                                            </div>
                                            {data.agencyLogo && (
                                                <div className="h-12 w-12 bg-white/10 rounded-lg flex items-center justify-center p-1.5 shrink-0">
                                                    <img src={data.agencyLogo} alt="Logo Agencia" className="max-h-full max-w-full object-contain" />
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </main>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
